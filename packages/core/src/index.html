<!doctype html>
<html lang="en" dir="auto">
    <head>
        <!-- Set skeleton theme color properties -->
        <style>
            :root {
                --color-surface-primary: #fff;
                --color-text-primary: #000;
                --initial-loader-display: flex;
            }

            #platform_name:after {
                content: var(--app-shell-platform-name);
                margin-left: 8px;
            }

            .derivatives-trader > .header__loading {
                background-color: var(--color-surface-primary);
                border-bottom: var(--color-surface-primary);
            }

            .derivatives-trader > .app-contents__loading {
                background-color: var(--color-surface-primary);
            }

            .derivatives-trader > .footer__loading {
                background-color: var(--color-surface-primary);
                border-bottom: var(--color-surface-primary);
            }

            .initial-loader {
                display: var(--initial-loader-display) !important;
            }
        </style>
        <!-- Start theme styles and mobile app loader control -->
        <script type="text/javascript">
            var l = window.location;

            // Check URL parameter first (takes priority)
            var urlParams = new URLSearchParams(l.search);
            var themeParam = urlParams.get('theme');

            var ui_store = localStorage.getItem('ui_store');
            var is_dark_theme = false;

            // Resolution order, mirrored by ui-store's resolveTheme():
            // theme param -> stored theme_preference -> legacy is_dark_mode_on -> prefers-color-scheme.
            if (themeParam === 'dark') {
                is_dark_theme = true;
            } else if (themeParam === 'light') {
                is_dark_theme = false;
            } else {
                var stored_ui = null;
                if (ui_store && ui_store.length > 0) {
                    try {
                        stored_ui = JSON.parse(ui_store);
                    } catch (e) {
                        stored_ui = null;
                    }
                }

                if (stored_ui && (stored_ui.theme_preference === 'dark' || stored_ui.theme_preference === 'light')) {
                    is_dark_theme = stored_ui.theme_preference === 'dark';
                } else if (
                    stored_ui &&
                    stored_ui.theme_preference !== 'system' &&
                    typeof stored_ui.is_dark_mode_on === 'boolean'
                ) {
                    // Legacy or unrecognised preference with a stored boolean: read the boolean as
                    // an explicit choice, exactly as ui-store's readStoredThemePreference() does,
                    // so an upgrade (or an unknown value from a newer build) never flips a
                    // returning user's theme. Only 'system' skips this and asks the OS.
                    is_dark_theme = stored_ui.is_dark_mode_on;
                } else if (window.matchMedia) {
                    is_dark_theme = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
            }

            if (is_dark_theme) {
                // Add dark class to HTML element before React loads
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                // if dark theme, change the property colors for dark theme
                document.documentElement.style.setProperty('--color-surface-primary', '#181c25');
                document.documentElement.style.setProperty('--color-text-primary', '#fff');
            } else {
                // Add light class for light theme
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            }

            // Declare the resolved scheme before React mounts, so browser-painted surfaces match and
            // automatic dark-theme features do not force-darken the page. Kept in step afterwards by
            // ui-store's changeTheme().
            document.documentElement.style.colorScheme = is_dark_theme ? 'dark' : 'light';

            // Hide web app loader when inside native mobile app to prevent double loaders
            var isMobileApp = urlParams.get('is_mobile_app') === 'true';
            if (isMobileApp) {
                document.documentElement.style.setProperty('--initial-loader-display', 'none');
            }
        </script>
        <!-- End theme styles and mobile app loader control -->
        <!-- Start Anti-Clickjack -->
        <style id="antiClickjack">
            body {
                display: none !important;
            }
        </style>
        <script type="text/javascript">
            if (self === top) {
                var antiClickjack = document.getElementById('antiClickjack');
                antiClickjack.parentNode.removeChild(antiClickjack);
            } else {
                top.location = self.location;
            }
        </script>
        <!-- End Anti-Clickjack -->

        <noscript>Your browser does not support JavaScript!</noscript>

        <!-- Start URL Handler -->
        <script type="text/javascript">
            (function (l) {
                if (l.search) {
                    // Create object without prototype to prevent pollution
                    var q = Object.create(null);

                    l.search
                        .slice(1)
                        .split('&')
                        .forEach(function (v) {
                            var a = v.split('=');
                            var key = a[0];

                            // Security checks
                            if (!key || key.length === 0) return;
                            if (key.includes('__proto__')) return;
                            if (key.includes('constructor')) return;
                            if (key.includes('prototype')) return;

                            var value = a.slice(1).join('=').replace(/~and~/g, '&');
                            q[key] = value;
                        });

                    // Use hasOwnProperty equivalent for prototype-less object
                    if (Object.prototype.hasOwnProperty.call(q, 'p')) {
                        window.history.replaceState(
                            null,
                            null,
                            l.pathname.slice(0, -1) +
                                (q.p || '') +
                                (Object.prototype.hasOwnProperty.call(q, 'q') ? '?' + q.q : '') +
                                l.hash
                        );
                    }
                }
            })(window.location);
        </script>
        <!-- End URL Handler -->

        <!-- Conditionally preload SmartCharts (Flutter Web) renderer files so each browser fetches
             only the set it will load. Flutter runs skwasm (skwasm.wasm + main.dart.wasm, ~2 MB) only
             on cross-origin-isolated Chromium with WasmGC; Firefox/Safari and any non-isolated context
             fall back to canvaskit (main.dart.js + canvaskit.wasm, ~8.5 MB). main.dart.mjs is needed by
             both. -->
        <script>
            (function () {
                var usesSkwasm = false;
                try {
                    // Intl.v8BreakIterator is Chromium-only — the gate Firefox/Safari fail.
                    var gcProbe = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]);
                    usesSkwasm =
                        window.crossOriginIsolated === true &&
                        typeof Intl.v8BreakIterator !== 'undefined' &&
                        WebAssembly.validate(gcProbe);
                } catch (e) {
                    /* unsupported environment — fall back to canvaskit path */
                }

                var files = usesSkwasm
                    ? [
                          {
                              as: 'fetch',
                              type: 'application/wasm',
                              href: '/js/smartcharts/chart/canvaskit/skwasm.wasm',
                          },
                          { as: 'fetch', type: 'application/wasm', href: '/js/smartcharts/chart/main.dart.wasm' },
                      ]
                    : [
                          { as: 'script', href: '/js/smartcharts/chart/main.dart.js' },
                          {
                              as: 'fetch',
                              type: 'application/wasm',
                              href: '/js/smartcharts/chart/canvaskit/canvaskit.wasm',
                          },
                      ];

                files.push({ as: 'script', href: '/js/smartcharts/chart/main.dart.mjs' });

                files.forEach(function (f) {
                    var link = document.createElement('link');
                    link.rel = 'preload';
                    link.crossOrigin = 'anonymous';
                    link.as = f.as;
                    if (f.type) link.type = f.type;
                    link.href = f.href;
                    document.head.appendChild(link);
                });
            })();
        </script>

        <!-- Load all fonts in single request with all required weights and language subsets -->
        <!-- Includes weights: 300,400,500,700 | Subsets: Latin, Cyrillic (Russian), Vietnamese -->
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            onload="
                this.onload = null;
                this.rel = 'stylesheet';
            "
        />

        <noscript>

                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
