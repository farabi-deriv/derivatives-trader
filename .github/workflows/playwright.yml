name: Playwright Tests

run-name: "Playwright | ${{ (github.event.schedule == '45 1 * * *' && 'production') || github.event.inputs.test_env || 'staging' }} | ${{ (github.event.schedule == '30 1 * * *' && 'smoke') || (github.event.schedule == '45 1 * * *' && 'smoke') || github.event.inputs.test_suite || (github.event_name == 'schedule' && 'regression') || 'smoke' }} | ${{ ((github.event.schedule == '30 1 * * *' || github.event.schedule == '45 1 * * *') && 'chromium-mobile') || github.event.inputs.platform || 'all' }}"

on:
  schedule:
    - cron: '0 22 * * 0-4'   # 06:00AM MYT Mon–Fri — staging regression (all)
    - cron: '30 1 * * *'     # 09:30AM MYT — staging smoke (chromium-mobile)
    - cron: '45 1 * * *'     # 09:45AM MYT — production smoke (chromium-mobile)
  workflow_call:
    inputs:
      test_env:
        description: 'Test environment'
        required: true
        type: string
      test_suite:
        description: 'Test suite to run'
        required: false
        type: string
      platform:
        description: 'Platform to test'
        required: false
        type: string
      spec_file:
        description: 'Spec file name (e.g. login.spec.ts). Leave blank to run the full suite'
        required: false
        type: string
      notify:
        description: 'Who to notify on failure'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
      platform:
        description: 'Platform to test'
        required: true
        default: 'chromium-all'
        type: choice
        options:
          - all
          - chromium
          - chromium-mobile
          - chromium-all
          - firefox
          - webkit
          - webkit-mobile
          - webkit-all
      spec_file:
        description: 'Spec file name (e.g. login.spec.ts). Leave blank to run the full suite'
        required: false
        default: ''
        type: string
      notify:
        description: 'Who to notify on failure'
        required: false
        type: choice
        default: 'skip'
        options:
          - skip
          - self
          - trading_apps_qa
          - squad_dtrader_fe
          - regression-team-1
          - regression-team-2
          - regression-team-3
          - regression-team-4

jobs:
  validate-inputs:
    name: Validate Inputs
    runs-on: github-hosted-playwright01
    outputs:
      resolved_spec: ${{ steps.resolve-spec.outputs.resolved_spec }}
      cron_env: ${{ steps.resolve-cron.outputs.cron_env }}
      cron_suite: ${{ steps.resolve-cron.outputs.cron_suite }}
      matrix: ${{ steps.resolve-matrix.outputs.matrix }}
      max_parallel: ${{ steps.resolve-matrix.outputs.max_parallel }}
    steps:
      - name: Checkout
        if: ${{ (github.event.inputs.spec_file || inputs.spec_file) != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Reject regression on production
        if: >-
          (github.event.inputs.test_env == 'production' && github.event.inputs.test_suite == 'regression') ||
          (inputs.test_env == 'production' && inputs.test_suite == 'regression')
        run: |
          echo "::error::Regression suite is not supported on production. Use smoke instead."
          exit 1

      - name: Resolve cron schedule
        id: resolve-cron
        if: ${{ github.event_name == 'schedule' }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 22 * * 0-4")  ENV="staging"    SUITE="regression" ;;
            "30 1 * * *")    ENV="staging"    SUITE="smoke" ;;
            "45 1 * * *")    ENV="production" SUITE="smoke" ;;
            *)
              echo "::error::No mapping for schedule '${{ github.event.schedule }}'"
              exit 1
              ;;
          esac
          echo "cron_env=${ENV}"     >> "$GITHUB_OUTPUT"
          echo "cron_suite=${SUITE}" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate spec file
        id: resolve-spec
        if: ${{ (github.event.inputs.spec_file || inputs.spec_file) != '' }}
        env:
          SPEC_FILE: ${{ github.event.inputs.spec_file || inputs.spec_file }}
        run: |
          SPEC_FILE="${SPEC_FILE//[[:space:]]/}"
          MATCHES=$(find "playwright/tests" -type f -name "$SPEC_FILE" 2>/dev/null || true)
          COUNT=$(echo "$MATCHES" | grep -c . || true)
          if [ -z "$MATCHES" ]; then
            echo "::error::Spec file '$SPEC_FILE' not found under playwright/tests"
            exit 1
          elif [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple spec files named '$SPEC_FILE' found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "resolved_spec=${MATCHES}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved spec: ${MATCHES}"

      - name: Resolve matrix platforms
        id: resolve-matrix
        run: |
          ALL='[{"platform":"chromium","name":"Chromium","browser":"chromium","grep_tag":"desktop"},{"platform":"chromium-mobile","name":"Chromium Mobile","browser":"chromium","grep_tag":"mobile"},{"platform":"firefox","name":"Firefox","browser":"firefox","grep_tag":"desktop"},{"platform":"webkit","name":"WebKit","browser":"webkit","grep_tag":"desktop"},{"platform":"webkit-mobile","name":"WebKit Mobile","browser":"webkit","grep_tag":"mobile"}]'
          SELECTED="${{ inputs.platform || github.event.inputs.platform || 'all' }}"
          SCHEDULE="${{ github.event.schedule }}"
          # Staging smoke (30 1) and production smoke (45 1) run chromium-mobile only.
          if [ "$SCHEDULE" = "30 1 * * *" ] || [ "$SCHEDULE" = "45 1 * * *" ]; then
            MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.platform == "chromium-mobile")]')
          elif [ "$SCHEDULE" = "0 22 * * 0-4" ]; then
            # Daily staging regression — all 5 browsers on Tuesday & Thursday (MYT).
            # 22:00 UTC runs match Monday & Wednesday UTC (day 1 & 3) → Tue & Thu MYT.
            DAY_OF_WEEK=$(date -u +%u)
            if [ "$DAY_OF_WEEK" -eq 1 ] || [ "$DAY_OF_WEEK" -eq 3 ]; then
              MATRIX="$ALL"
            else
              MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.browser == "chromium")]')
            fi
          elif [ "$SELECTED" = "all" ]; then
            MATRIX="$ALL"
          elif [ "$SELECTED" = "chromium-all" ]; then
            MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.browser == "chromium")]')
          elif [ "$SELECTED" = "webkit-all" ]; then
            MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.browser == "webkit")]')
          else
            MATRIX=$(echo "$ALL" | jq -c --arg sel "$SELECTED" '[.[] | select(.platform == $sel)]')
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          # Cap parallelism at 2 to avoid shared-account login races (see strategy.max-parallel below).
          MATRIX_COUNT=$(echo "$MATRIX" | jq 'length')
          if [ "$MATRIX_COUNT" -le 1 ]; then
            MAX_PARALLEL=1
          elif [ "$MATRIX_COUNT" -le 2 ]; then
            MAX_PARALLEL="$MATRIX_COUNT"
          else
            MAX_PARALLEL=2
          fi
          echo "max_parallel=${MAX_PARALLEL}" >> "$GITHUB_OUTPUT"

  playwright-tests:
    name: Playwright Tests - ${{ matrix.name }} (${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }} / ${{ needs.validate-inputs.outputs.cron_suite || inputs.test_suite || github.event.inputs.test_suite || 'smoke' }})
    needs: validate-inputs
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Matrix platforms share the same test account, so cap concurrency at 2 to avoid concurrent-login races.
      max-parallel: ${{ fromJSON(needs.validate-inputs.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.validate-inputs.outputs.matrix) }}
    runs-on: github-hosted-playwright01
    environment: ${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Decrypt Playwright env files
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
          TEST_ENV: ${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
        run: |
          case "$TEST_ENV" in
            staging|production) ;;
            *) echo "::error::Invalid TEST_ENV: $TEST_ENV"; exit 1 ;;
          esac
          ./playwright/e2e-tests-core/scripts/env-cipher.sh decrypt "$TEST_ENV"

      - name: Run Playwright tests (${{ matrix.name }})
        env:
          TEST_ENV: ${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          TEST_SUITE: ${{ needs.validate-inputs.outputs.cron_suite || inputs.test_suite || github.event.inputs.test_suite || 'smoke' }}
          RESOLVED_SPEC: ${{ needs.validate-inputs.outputs.resolved_spec }}
          GREP_TAG: ${{ matrix.grep_tag }}
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
        run: |
          RESOLVED_SPEC="${RESOLVED_SPEC//[[:space:]]/}"
          if [ -n "$RESOLVED_SPEC" ]; then
            npx playwright test --project=${{ matrix.platform }} "$RESOLVED_SPEC"
          else
            if [ "$TEST_SUITE" = "regression" ]; then
              GREP_PATTERN="(?=.*@${GREP_TAG})"
            else
              GREP_PATTERN="(?=.*@${GREP_TAG})(?=.*@${TEST_SUITE})"
            fi
            if [ "$TEST_ENV" = "production" ]; then
              GREP_PATTERN="${GREP_PATTERN}(?=.*@production)"
            fi
            npx playwright test --project=${{ matrix.platform }} --grep "$GREP_PATTERN"
          fi

      - name: Publish TestDino Summary
        if: always()
        continue-on-error: true
        env:
          TESTDINO_ACCESS_TOKEN: ${{ secrets.TESTDINO_ACCESS_TOKEN }}
          TESTDINO_PROJECT_ID: ${{ vars.TESTDINO_PROJECT_ID }}
          TESTDINO_ORG_ID: ${{ vars.TESTDINO_ORG_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: node playwright/e2e-tests-core/scripts/github-summary-testdino.js

      - name: Upload Playwright Report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: always()
        with:
          name: playwright-report-${{ matrix.platform }}-${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          path: playwright/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.platform }}-${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          path: playwright/test-results/
          retention-days: 7

      - name: Save Slack Result Artifact (${{ matrix.name }})
        if: always() && (inputs.notify || github.event.inputs.notify) != 'skip'
        continue-on-error: true
        run: node playwright/e2e-tests-core/scripts/slack-notify-testdino.js
        env:
          MODE: collect
          RESULT_OUTPUT_PATH: playwright/agent/.healing/slack-results/_result-${{ matrix.platform }}.json
          TESTDINO_ACCESS_TOKEN: ${{ secrets.TESTDINO_ACCESS_TOKEN }}
          TESTDINO_PROJECT_ID: ${{ vars.TESTDINO_PROJECT_ID }}
          TESTDINO_ORG_ID: ${{ vars.TESTDINO_ORG_ID }}
          TEST_ENV: ${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          TEST_SUITE: ${{ needs.validate-inputs.outputs.cron_suite || inputs.test_suite || github.event.inputs.test_suite || 'smoke' }}
          PLATFORM: ${{ matrix.platform }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          NOTIFY: ${{ inputs.notify || github.event.inputs.notify || (github.event_name == 'schedule' && 'trading_apps_qa') || '' }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload Slack Result Artifact (${{ matrix.name }})
        if: always() && (inputs.notify || github.event.inputs.notify) != 'skip'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: _playwright-slack-result-${{ matrix.platform }}
          path: playwright/agent/.healing/slack-results/_result-${{ matrix.platform }}.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1

      - name: Clean-up Decrypted Env Files
        if: always()
        run: rm -f playwright/.env.staging playwright/.env.production

  notify:
    name: Slack Notification
    needs: [validate-inputs, playwright-tests]
    runs-on: github-hosted-playwright01
    # Does not fire on cancellation — intentional (cancelled runs are not notified)
    # '' (empty string, e.g. scheduled runs) means "use default channel" — only 'skip' suppresses notification
    if: (success() || failure()) && (inputs.notify || github.event.inputs.notify) != 'skip'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Download all Slack result artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          pattern: _playwright-slack-result-*
          path: playwright/agent/.healing/slack-results
          merge-multiple: true

      - name: Send Slack Notification
        continue-on-error: true
        run: node playwright/e2e-tests-core/scripts/slack-notify-testdino.js
        env:
          MODE: notify
          SLACK_OAUTH_TOKEN: ${{ secrets.AUTO_OPS_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ (needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging') == 'production' && vars.PROD_QA_SLACK_CHANNEL_ID || vars.QA_SLACK_CHANNEL_ID }}
          RESULTS_DIR: playwright/agent/.healing/slack-results
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY: ${{ inputs.notify || github.event.inputs.notify || (github.event_name == 'schedule' && 'trading_apps_qa') || '' }}
