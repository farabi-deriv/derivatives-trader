name: Playwright Tests

run-name: "Playwright | ${{ (github.event.schedule == '45 1 * * *' && 'production') || ((github.event.inputs.preview_url || inputs.preview_url) != '' && 'preview') || github.event.inputs.test_env || inputs.test_env || 'staging' }} | ${{ (github.event.schedule == '30 1 * * *' && 'smoke') || (github.event.schedule == '45 1 * * *' && 'smoke') || github.event.inputs.test_suite || inputs.test_suite || (github.event_name == 'schedule' && 'regression') || 'smoke' }} | ${{ ((github.event.schedule == '30 1 * * *' || github.event.schedule == '45 1 * * *') && 'chromium-mobile') || (github.event.schedule == '0 22 * * 0,1,3,4' && 'chromium-all') || (github.event.schedule == '0 22 * * 2' && 'all') || github.event.inputs.platform || inputs.platform || 'all' }}"

on:
  schedule:
    # 06:00AM MYT Mon–Fri staging regression. Split so run-name matches the matrix
    # (github.event.schedule has no day-of-week helper). Tue UTC 22:00 = Wed MYT.
    - cron: '0 22 * * 0,1,3,4' # Mon/Tue/Thu/Fri MYT — chromium desktop + mobile
    - cron: '0 22 * * 2'       # Wed MYT — all 5 browsers
    - cron: '30 1 * * *'       # 09:30AM MYT — staging smoke (chromium-mobile)
    - cron: '45 1 * * *'       # 09:45AM MYT — production smoke (chromium-mobile)
  workflow_call:
    inputs:
      test_env:
        description: 'Test environment'
        required: true
        type: string
      test_suite:
        description: 'Test suite to run'
        required: false
        type: string
      platform:
        description: 'Platform to test'
        required: false
        type: string
      spec_file:
        description: 'Spec file name (e.g. login.spec.ts). Leave blank to run the full suite'
        required: false
        type: string
      notify:
        description: 'Who to notify on failure'
        required: false
        type: string
      preview_url:
        description: 'PR preview URL (pages.dev). Uses staging credentials; overrides BASE_URL from .env.staging'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      test_env:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
      platform:
        description: 'Platform to test'
        required: true
        default: 'chromium-all'
        type: choice
        options:
          - all
          - chromium
          - chromium-mobile
          - chromium-all
          - firefox
          - webkit
          - webkit-mobile
          - webkit-all
      spec_file:
        description: 'Spec file name (e.g. login.spec.ts). Leave blank to run the full suite'
        required: false
        default: ''
        type: string
      notify:
        description: 'Who to notify on failure'
        required: false
        type: choice
        default: 'skip'
        options:
          - skip
          - self
          - trading_apps_qa
          - squad_dtrader_fe
          - regression-team-1
          - regression-team-2
          - regression-team-3
          - regression-team-4
      preview_url:
        description: 'PR preview URL (e.g. https://fix-qa-test.derivatives-trader.pages.dev). Staging credentials; overrides BASE_URL'
        required: false
        default: ''
        type: string

jobs:
  validate-inputs:
    name: Validate Inputs
    runs-on: github-hosted-playwright01
    outputs:
      resolved_spec: ${{ steps.resolve-spec.outputs.resolved_spec }}
      resolved_preview_url: ${{ steps.resolve-preview-url.outputs.resolved_preview_url }}
      cron_env: ${{ steps.resolve-cron.outputs.cron_env }}
      cron_suite: ${{ steps.resolve-cron.outputs.cron_suite }}
      matrix: ${{ steps.resolve-matrix.outputs.matrix }}
      max_parallel: ${{ steps.resolve-matrix.outputs.max_parallel }}
      shard_total: ${{ steps.resolve-matrix.outputs.shard_total }}
      report_platforms: ${{ steps.resolve-matrix.outputs.report_platforms }}
    steps:
      - name: Checkout
        if: ${{ (github.event.inputs.spec_file || inputs.spec_file) != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Reject regression on production
        if: >-
          (github.event.inputs.test_env == 'production' && github.event.inputs.test_suite == 'regression') ||
          (inputs.test_env == 'production' && inputs.test_suite == 'regression')
        run: |
          echo "::error::Regression suite is not supported on production. Use smoke instead."
          exit 1

      - name: Validate preview URL
        id: resolve-preview-url
        env:
          PREVIEW_URL_INPUT: ${{ github.event.inputs.preview_url || inputs.preview_url || '' }}
          TEST_ENV_INPUT: ${{ github.event.inputs.test_env || inputs.test_env || 'staging' }}
        run: |
          PREVIEW_URL_INPUT="${PREVIEW_URL_INPUT//[[:space:]]/}"
          if [ -z "$PREVIEW_URL_INPUT" ]; then
            exit 0
          fi
          if [ "$TEST_ENV_INPUT" = "production" ]; then
            echo "::error::preview_url cannot be used with test_env=production. Use test_env=staging."
            exit 1
          fi
          case "$PREVIEW_URL_INPUT" in
            https://*) ;;
            *)
              echo "::error::preview_url must start with https:// (got: $PREVIEW_URL_INPUT)"
              exit 1
              ;;
          esac
          PREVIEW_URL_INPUT="${PREVIEW_URL_INPUT%/}"
          echo "resolved_preview_url=${PREVIEW_URL_INPUT}" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview mode — BASE_URL=${PREVIEW_URL_INPUT} (staging credentials from .env.staging)"

      - name: Resolve cron schedule
        id: resolve-cron
        if: ${{ github.event_name == 'schedule' }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 22 * * 0,1,3,4"|"0 22 * * 2") ENV="staging" SUITE="regression" ;;
            "30 1 * * *")                    ENV="staging" SUITE="smoke" ;;
            "45 1 * * *")                    ENV="production" SUITE="smoke" ;;
            *)
              echo "::error::No mapping for schedule '${{ github.event.schedule }}'"
              exit 1
              ;;
          esac
          echo "cron_env=${ENV}"     >> "$GITHUB_OUTPUT"
          echo "cron_suite=${SUITE}" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate spec file
        id: resolve-spec
        if: ${{ (github.event.inputs.spec_file || inputs.spec_file) != '' }}
        env:
          SPEC_FILE: ${{ github.event.inputs.spec_file || inputs.spec_file }}
        run: |
          SPEC_FILE="${SPEC_FILE//[[:space:]]/}"
          MATCHES=$(find "playwright/tests" -type f -name "$SPEC_FILE" 2>/dev/null || true)
          COUNT=$(echo "$MATCHES" | grep -c . || true)
          if [ -z "$MATCHES" ]; then
            echo "::error::Spec file '$SPEC_FILE' not found under playwright/tests"
            exit 1
          elif [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple spec files named '$SPEC_FILE' found:"
            echo "$MATCHES"
            exit 1
          fi
          echo "resolved_spec=${MATCHES}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved spec: ${MATCHES}"

      - name: Resolve matrix platforms
        id: resolve-matrix
        env:
          RESOLVED_SPEC: ${{ steps.resolve-spec.outputs.resolved_spec || '' }}
          PREVIEW_URL: ${{ steps.resolve-preview-url.outputs.resolved_preview_url || '' }}
        run: |
          ALL='[{"platform":"chromium","name":"Chromium","browser":"chromium","grep_tag":"desktop"},{"platform":"chromium-mobile","name":"Chromium Mobile","browser":"chromium","grep_tag":"mobile"},{"platform":"firefox","name":"Firefox","browser":"firefox","grep_tag":"desktop"},{"platform":"webkit","name":"WebKit","browser":"webkit","grep_tag":"desktop"},{"platform":"webkit-mobile","name":"WebKit Mobile","browser":"webkit","grep_tag":"mobile"}]'
          SELECTED="${{ inputs.platform || github.event.inputs.platform || 'all' }}"
          SCHEDULE="${{ github.event.schedule }}"
          # Staging smoke (30 1) and production smoke (45 1) run chromium-mobile only.
          if [ "$SCHEDULE" = "30 1 * * *" ] || [ "$SCHEDULE" = "45 1 * * *" ]; then
            MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.platform == "chromium-mobile")]')
          elif [ "$SCHEDULE" = "0 22 * * 0,1,3,4" ]; then
            # Mon/Tue/Thu/Fri MYT — chromium desktop + mobile
            MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.browser == "chromium")]')
          elif [ "$SCHEDULE" = "0 22 * * 2" ]; then
            # Wed MYT (Tue UTC 22:00) — all 5 browsers
            MATRIX="$ALL"
          elif [ "$SELECTED" = "all" ]; then
            MATRIX="$ALL"
          elif [ "$SELECTED" = "chromium-all" ]; then
            MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.browser == "chromium")]')
          elif [ "$SELECTED" = "webkit-all" ]; then
            MATRIX=$(echo "$ALL" | jq -c '[.[] | select(.browser == "webkit")]')
          else
            MATRIX=$(echo "$ALL" | jq -c --arg sel "$SELECTED" '[.[] | select(.platform == $sel)]')
          fi

          if [ -n "$RESOLVED_SPEC" ]; then
            SHARD_TOTAL=1
          else
            # Hardcoded default — smoke and regression split across 4 shard jobs per platform (incl. preview runs).
            SHARD_TOTAL=4
          fi

          if [ "$SHARD_TOTAL" -le 1 ]; then
            EXPANDED=$(echo "$MATRIX" | jq -c '[.[] | . + {shard_index: 1, shard_total: 1}]')
          else
            EXPANDED=$(echo "$MATRIX" | jq -c --argjson total "$SHARD_TOTAL" '
              [.[] | . as $p | range(1; $total + 1) | $p + {shard_index: ., shard_total: $total}]
            ')
          fi
          echo "matrix=${EXPANDED}" >> "$GITHUB_OUTPUT"
          echo "shard_total=${SHARD_TOTAL}" >> "$GITHUB_OUTPUT"
          echo "report_platforms=$(echo "$MATRIX" | jq -c '[.[].platform] | unique')" >> "$GITHUB_OUTPUT"
          echo "::notice::Shard total: ${SHARD_TOTAL} ($(echo "$EXPANDED" | jq 'length') matrix jobs)"

          # Concurrency: only the full 5-browser matrix is capped (shared-account pressure).
          # Single-platform and chromium-all / webkit-all set max-parallel to the job count so
          # desktop + mobile shards can run together (GHA has no way to omit the key).
          MATRIX_COUNT=$(echo "$EXPANDED" | jq 'length')
          PLATFORM_COUNT=$(echo "$MATRIX" | jq 'length')
          if [ "$PLATFORM_COUNT" -ge 5 ]; then
            MAX_PARALLEL=4
          else
            MAX_PARALLEL="$MATRIX_COUNT"
          fi
          echo "max_parallel=${MAX_PARALLEL}" >> "$GITHUB_OUTPUT"
          echo "::notice::max-parallel=${MAX_PARALLEL} (platforms=${PLATFORM_COUNT})"

  playwright-tests:
    name: Playwright Tests - ${{ matrix.name }}${{ matrix.shard_total > 1 && format(' (shard {0}/{1})', matrix.shard_index, matrix.shard_total) || '' }} (${{ needs.validate-inputs.outputs.resolved_preview_url && 'preview' || needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }} / ${{ needs.validate-inputs.outputs.cron_suite || inputs.test_suite || github.event.inputs.test_suite || 'smoke' }})
    needs: validate-inputs
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Full 5-browser matrix caps at 4 (shared-account pressure). Single-platform and
      # chromium-all / webkit-all use job count so desktop + mobile run together — see
      # resolve-matrix. GHA requires a value; "uncapped" = max-parallel equal to matrix size.
      max-parallel: ${{ fromJSON(needs.validate-inputs.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.validate-inputs.outputs.matrix) }}
    runs-on: github-hosted-playwright01
    environment: ${{ needs.validate-inputs.outputs.resolved_preview_url && 'staging' || needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Decrypt Playwright env files
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
          TEST_ENV: ${{ needs.validate-inputs.outputs.resolved_preview_url && 'staging' || needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
        run: |
          case "$TEST_ENV" in
            staging|production) ;;
            *) echo "::error::Invalid TEST_ENV: $TEST_ENV"; exit 1 ;;
          esac
          ./playwright/e2e-tests-core/scripts/env-cipher.sh decrypt "$TEST_ENV"

      - name: Run Playwright tests (${{ matrix.name }}${{ matrix.shard_total > 1 && format(' shard {0}/{1}', matrix.shard_index, matrix.shard_total) || '' }})
        env:
          TEST_ENV: ${{ needs.validate-inputs.outputs.resolved_preview_url && 'staging' || needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          TEST_SUITE: ${{ needs.validate-inputs.outputs.cron_suite || inputs.test_suite || github.event.inputs.test_suite || 'smoke' }}
          RESOLVED_SPEC: ${{ needs.validate-inputs.outputs.resolved_spec }}
          PREVIEW_BASE_URL: ${{ needs.validate-inputs.outputs.resolved_preview_url }}
          GREP_TAG: ${{ matrix.grep_tag }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
          CI: true
          # TestDino live streaming (see playwright.config.ts). TESTDINO_STREAM=1 enables blob +
          # @testdino/playwright per shard. All shards of a platform share TESTDINO_CI_RUN_ID.
          TESTDINO_STREAM: "1"
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_TAG: ${{ matrix.platform }}
          TESTDINO_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
        run: |
          if [ -n "$PREVIEW_BASE_URL" ]; then
            export BASE_URL="$PREVIEW_BASE_URL"
            echo "::notice::Running against preview BASE_URL=$BASE_URL"
          fi
          RESOLVED_SPEC="${RESOLVED_SPEC//[[:space:]]/}"
          SHARD_ARGS=""
          if [ "$SHARD_TOTAL" -gt 1 ]; then
            SHARD_ARGS="--shard=${SHARD_INDEX}/${SHARD_TOTAL}"
            echo "::notice::Running shard ${SHARD_INDEX}/${SHARD_TOTAL}"
          fi
          if [ -n "$RESOLVED_SPEC" ]; then
            npx playwright test --project=${{ matrix.platform }} $SHARD_ARGS "$RESOLVED_SPEC"
          else
            if [ "$TEST_SUITE" = "regression" ]; then
              GREP_PATTERN="(?=.*@${GREP_TAG})"
            else
              GREP_PATTERN="(?=.*@${GREP_TAG})(?=.*@${TEST_SUITE})"
            fi
            if [ "$TEST_ENV" = "production" ] && [ -z "$BASE_URL" ]; then
              GREP_PATTERN="${GREP_PATTERN}(?=.*@production)"
            fi
            npx playwright test --project=${{ matrix.platform }} $SHARD_ARGS --grep "$GREP_PATTERN"
          fi

      - name: Upload blob report (${{ matrix.platform }} shard ${{ matrix.shard_index }})
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.platform }}-${{ matrix.shard_index }}-${{ github.run_attempt }}
          path: blob-report/
          retention-days: 1

      - name: Upload Test Results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.platform }}-shard-${{ matrix.shard_index }}-${{ needs.validate-inputs.outputs.resolved_preview_url && 'preview' || needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          path: playwright/test-results/
          retention-days: 7

      - name: Clean-up Decrypted Env Files
        if: always()
        run: rm -f playwright/.env.staging playwright/.env.production

  report:
    name: Merge & report (${{ matrix.platform }})
    needs: [validate-inputs, playwright-tests]
    if: ${{ !cancelled() }}
    runs-on: github-hosted-playwright01
    environment: ${{ needs.validate-inputs.outputs.resolved_preview_url && 'staging' || needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate-inputs.outputs.report_platforms) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          path: all-blob-reports
          # Scope to THIS run attempt + THIS platform. The [0-9] anchor is REQUIRED so
          # the 'chromium' glob does not also swallow 'chromium-mobile-*' blobs.
          pattern: blob-${{ matrix.platform }}-[0-9]*-${{ github.run_attempt }}
          merge-multiple: true

      - name: Merge into HTML and JSON reports
        env:
          PLAYWRIGHT_MERGE_REPORTS: "1"
        run: |
          BLOB_COUNT=$(find all-blob-reports -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          echo "Blob archives to merge: ${BLOB_COUNT}"
          if [ "$BLOB_COUNT" -eq 0 ]; then
            echo "::warning::No blob reports found for ${{ matrix.platform }} — skipping merge"
            exit 0
          fi
          npx playwright merge-reports --config playwright.config.ts ./all-blob-reports

      - name: Publish TestDino Summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TESTDINO_ACCESS_TOKEN: ${{ secrets.TESTDINO_ACCESS_TOKEN }}
          TESTDINO_PROJECT_ID: ${{ vars.TESTDINO_PROJECT_ID }}
          TESTDINO_ORG_ID: ${{ vars.TESTDINO_ORG_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: node playwright/e2e-tests-core/scripts/github-summary-testdino.js

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: playwright-report-${{ matrix.platform }}-${{ needs.validate-inputs.outputs.resolved_preview_url && 'preview' || needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          path: playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save Slack Result Artifact (${{ matrix.platform }})
        if: always() && (inputs.notify || github.event.inputs.notify) != 'skip'
        continue-on-error: true
        run: node playwright/e2e-tests-core/scripts/slack-notify-testdino.js
        env:
          MODE: collect
          RESULT_OUTPUT_PATH: playwright/agent/.healing/slack-results/_result-${{ matrix.platform }}.json
          TESTDINO_ACCESS_TOKEN: ${{ secrets.TESTDINO_ACCESS_TOKEN }}
          TESTDINO_PROJECT_ID: ${{ vars.TESTDINO_PROJECT_ID }}
          TESTDINO_ORG_ID: ${{ vars.TESTDINO_ORG_ID }}
          TEST_ENV: ${{ needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging' }}
          TEST_SUITE: ${{ needs.validate-inputs.outputs.cron_suite || inputs.test_suite || github.event.inputs.test_suite || 'smoke' }}
          PLATFORM: ${{ matrix.platform }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          NOTIFY: ${{ inputs.notify || github.event.inputs.notify || (github.event_name == 'schedule' && 'trading_apps_qa') || '' }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload Slack Result Artifact (${{ matrix.platform }})
        if: always() && (inputs.notify || github.event.inputs.notify) != 'skip'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: _playwright-slack-result-${{ matrix.platform }}
          path: playwright/agent/.healing/slack-results/_result-${{ matrix.platform }}.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1

  notify:
    name: Slack Notification
    needs: [validate-inputs, report]
    runs-on: github-hosted-playwright01
    if: (success() || failure()) && (inputs.notify || github.event.inputs.notify) != 'skip'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Download Slack result artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          pattern: _playwright-slack-result-*
          path: playwright/agent/.healing/slack-results
          merge-multiple: true

      - name: Send Slack Notification
        continue-on-error: true
        run: node playwright/e2e-tests-core/scripts/slack-notify-testdino.js
        env:
          MODE: notify
          SLACK_OAUTH_TOKEN: ${{ secrets.AUTO_OPS_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ (needs.validate-inputs.outputs.cron_env || inputs.test_env || github.event.inputs.test_env || 'staging') == 'production' && vars.PROD_QA_SLACK_CHANNEL_ID || vars.QA_SLACK_CHANNEL_ID }}
          RESULTS_DIR: playwright/agent/.healing/slack-results
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY: ${{ inputs.notify || github.event.inputs.notify || (github.event_name == 'schedule' && 'trading_apps_qa') || '' }}
