name: Test & Validate
on:
  pull_request:
    branches:
    - master
permissions:
  contents: read
jobs:
  build:
    name: Build Project
    runs-on: runner_8cores_derivatives_trader
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    environment: Preview
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: "./.github/actions/setup_node"
    - name: Install dependencies
      uses: "./.github/actions/npm_install_from_cache"
    - name: Build
      uses: "./.github/actions/build"

    # Structural safety net — full chunk-name assertion runs here because dist/ exists after Build.
    - name: Run baseline check (chunks)
      run: npm run baseline:check

  validate:
    name: TypeScript & Linting
    runs-on: runner_8cores_derivatives_trader
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    environment: Preview
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: "./.github/actions/setup_node"
    - name: Install dependencies
      uses: "./.github/actions/npm_install_from_cache"
    
    # TypeScript gate — runs every gated package's project in parallel and fails on any of them.
    - name: Check TypeScript
      run: npm run test:typescript

    # Import checking
    - name: Check imports
      run: npm run check-imports

    # Dead-code safety net — fails only on findings new versus the committed knip baseline.
    - name: Run knip check
      run: npm run knip:check

    # The safety-net scripts' own unit tests (scripts/__tests__/) — outside the root jest
    # project glob (packages/*), so they need an explicit step.
    - name: Run safety-net script tests
      run: npm run test:scripts

    # Structural safety net — route-map + alias-root assertions (chunk assertion auto-skips
    # without dist/ here; the build job runs the full chunk assertion against its dist/).
    - name: Run baseline check
      run: npm run baseline:check

    # Test structure checking
    - name: Check tests for @deriv/utils
      run: bash ./scripts/check-tests.sh packages/utils/src
    
    # Linting (parallel) — each PID is waited on individually so either failure fails the step.
    - name: Run linting
      run: |
        npm run test:stylelint &
        stylelint_pid=$!
        npm run test:eslint-all &
        eslint_pid=$!
        stylelint_status=0
        eslint_status=0
        wait "$stylelint_pid" || stylelint_status=$?
        wait "$eslint_pid" || eslint_status=$?
        if [ "$stylelint_status" -ne 0 ] || [ "$eslint_status" -ne 0 ]; then
          echo "stylelint exited $stylelint_status, eslint exited $eslint_status"
          exit 1
        fi
  test:
    name: Tests - ${{ matrix.description }}
    runs-on: runner_8cores_derivatives_trader
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
    environment: Preview
    strategy:
      matrix:
        include:
          - group: 1
            packages: "packages/trader"
            description: "Trader"
          - group: 2
            packages: "packages/core packages/reports"
            description: "Core & Reports"
          - group: 4
            packages: "packages/api packages/shared packages/stores packages/utils packages/components"
            description: "APIs, Utils & Components"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: "./.github/actions/setup_node"
    - name: Install dependencies
      uses: "./.github/actions/npm_install_from_cache"
    
    # Run tests for specific packages
    - name: Run tests for ${{ matrix.description }}
      run: |
        packages="${{ matrix.packages }}"
        test_pattern=""
        for package in $packages; do
          if [ -f "$package/jest.config.js" ]; then
            echo "Running tests for $package"
            if [ -z "$test_pattern" ]; then
              test_pattern="$package"
            else
              test_pattern="$test_pattern|$package"
            fi
          fi
        done
        
        if [ -n "$test_pattern" ]; then
          echo "Running tests with pattern: ($test_pattern)"
          npm run test:jest -- --testPathPattern="($test_pattern)"
        else
          echo "No jest configs found for: $packages"
          exit 1
        fi