name: Forge — issue to PR

# Add the `forge` label to an issue and Forge opens a PR that closes it.
#
# The implementation lives in deriv-com/shared-actions so every repo shares one
# copy. This file owns only what is repo-specific: the triggers, and the
# toolchain/model settings passed in below.
#
# Two ways in, one code path:
#   • `forge` label on an issue — the human flow.
#   • workflow_dispatch          — the Slack flow (deriv-com/forge-agent), which
#     passes the Slack thread so the outcome can be posted back to it.
#
# Verify commands are NOT set here: the engine reads them from
# spec-to-pr.config.json in this repo.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to work on"
        required: true
        type: string
      slack_channel:
        description: "Slack channel id to report back to (optional)"
        required: false
        type: string
      slack_thread_ts:
        description: "Slack thread ts to reply into (optional)"
        required: false
        type: string
      requested_by:
        description: "Slack user id that asked for this, for the audit trail"
        required: false
        type: string

jobs:
  forge:
    # Label path fires only for `forge`; the dispatch path is always intentional.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'forge'

    # Least privilege for the ambient GITHUB_TOKEN, matching every other
    # reusable-workflow caller in this repo. A caller's grant also caps what the
    # called workflow can request, so leaving this out would make the job depend
    # on the repo/org default — broader than needed if that default is
    # permissive, and silently short of `issues: write` if it is restrictive.
    #
    # (Forge's own repo writes use minted App tokens, not this token.)
    permissions:
      contents: read
      issues: write

    uses: deriv-com/shared-actions/.github/workflows/forge.yml@master

    # Inherited from the reusable workflow and NOT settable here — a job with
    # `uses:` may not declare `runs-on`, `timeout-minutes` or `steps`. Recorded
    # so the constraints are reviewable without opening the other repo:
    #
    #   timeout-minutes: 55   — App installation tokens expire after 1 hour, so
    #                           the run must finish inside that window or the
    #                           final push cannot authenticate.
    #   concurrency:          — forge-<repo>-<issue_number>, cancel-in-progress
    #                           false. Per-issue dedupe, so a re-applied label or
    #                           the Slack path racing the label path queues
    #                           instead of opening two PRs. Keyed by repo too, so
    #                           callers cannot collide with each other.
    with:
      issue_number: ${{ github.event.inputs.issue_number || github.event.issue.number }}
      slack_channel: ${{ github.event.inputs.slack_channel }}
      slack_thread_ts: ${{ github.event.inputs.slack_thread_ts }}
      requested_by: ${{ github.event.inputs.requested_by }}

      # Mirrors ./.github/actions/setup_node + npm_install_from_cache, which a
      # reusable workflow cannot call (a relative `uses:` there resolves against
      # this repo but would break every other caller), so the behaviour is passed
      # in instead.
      node_version: "20.x"
      install_command: "npm ci && npm run bootstrap:ci"

      # Repository variable (Settings → Secrets and variables → Actions →
      # Variables), so the model can change without touching this file.
      model: ${{ vars.FORGE_MODEL || 'claude-haiku-4-5' }}

      # Pinned explicitly even though it matches the reusable workflow's default.
      # The LiteLLM gateway sits behind a Cloudflare WAF that challenges generic
      # GitHub-hosted IPs — on ubuntu-latest every run dies with
      # "Failed to authenticate. API Error: Attention Required! | Cloudflare"
      # before the key is even checked. This group is the allow-listed path (the
      # same one claude-pr-review.yml uses). Naming it here keeps that hard-won
      # requirement visible in this repo and immune to an upstream default change.
      runner_group: github_claude_code_reviewer

    secrets:
      CLIENT_ID_GHAPP_WRITE: ${{ secrets.CLIENT_ID_GHAPP_WRITE }}
      PRIVATE_KEY_GHAPP_WRITE: ${{ secrets.PRIVATE_KEY_GHAPP_WRITE }}
      CLIENT_ID_GHAPP: ${{ secrets.CLIENT_ID_GHAPP }}
      PRIVATE_KEY_GHAPP: ${{ secrets.PRIVATE_KEY_GHAPP }}
      FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
      LITELLM_API_URL: ${{ secrets.LITELLM_API_URL }}
      FORGE_SLACK_BOT_TOKEN: ${{ secrets.FORGE_SLACK_BOT_TOKEN }}
