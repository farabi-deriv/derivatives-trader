name: build
description: Build all packages
inputs:
  REF_NAME:
    description: 'Git ref name'
    required: true
    default: 'test'
  APP_VERSION:
    description: 'Deployed build version stamped onto analytics events and /app-info.json'
    required: false
  NODE_ENV:
    description: 'Node environment'
    required: false
    default: 'test'
  RUDDERSTACK_KEY:
    description: 'Rudderstack key'
    required: false
  POSTHOG_KEY:
    description: 'PostHog API key'
    required: false
  POSTHOG_HOST:
    description: 'PostHog host URL'
    required: false
  REMOTE_CONFIG_URL:
    description: 'Remote config URL'
    required: true
  # TRUSTPILOT_API_KEY:
  #   description: 'Trustpilot api key'
  #   required: false

runs:
  using: composite
  steps:
  - name: Build all packages
    env:
      NODE_ENV: ${{ inputs.NODE_ENV }}
      RUDDERSTACK_KEY: ${{ inputs.RUDDERSTACK_KEY }}
      POSTHOG_KEY: ${{ inputs.POSTHOG_KEY }}
      POSTHOG_HOST: ${{ inputs.POSTHOG_HOST }}
      REF_NAME: ${{ inputs.REF_NAME }}
      APP_VERSION: ${{ inputs.APP_VERSION }}
      REMOTE_CONFIG_URL: ${{ inputs.REMOTE_CONFIG_URL }}
      # TRUSTPILOT_API_KEY: ${{ inputs.TRUSTPILOT_API_KEY }}
      R2_PROJECT_NAME: ${{ inputs.R2_PROJECT_NAME }}
      CROWDIN_BRANCH_NAME: ${{ inputs.CROWDIN_BRANCH_NAME }}
    run: npm run build:all
    shell: bash
